# Temporary port-80 site used before the certificates exist (provision.sh installs it,
# then replaces it with ppixelmedia.com.conf + api.ppixelmedia.com.conf once certbot succeeded).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ppixelmedia.com www.ppixelmedia.com api.ppixelmedia.com _;

    include snippets/pixellap-acme.conf;

    location / {
        return 503 "Pixellap is being set up.\n";
        default_type text/plain;
    }
}
