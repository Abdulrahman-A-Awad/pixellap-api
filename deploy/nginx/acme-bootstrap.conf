# Temporary port-80 site used before the certificates exist (provision.sh installs it,
# then replaces it with pixellap.com.conf + api.pixellap.com.conf once certbot succeeded).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name pixellap.com www.pixellap.com api.pixellap.com _;

    include snippets/pixellap-acme.conf;

    location / {
        return 503 "Pixellap is being set up.\n";
        default_type text/plain;
    }
}
