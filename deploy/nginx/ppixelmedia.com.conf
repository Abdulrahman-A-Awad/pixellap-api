# Pixellap website (Next.js under PM2 on 127.0.0.1:3000).
# Installed by provision.sh as /etc/nginx/sites-available/ppixelmedia.com.conf once the
# Let's Encrypt certificate exists (before that, acme-bootstrap.conf answers on port 80).
# Ubuntu 24.04 ships Nginx 1.24 -> HTTP/2 is enabled on the `listen` line.

upstream pixellap_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP: Let's Encrypt challenges, everything else -> https://ppixelmedia.com
server {
    listen 80;
    listen [::]:80;
    server_name ppixelmedia.com www.ppixelmedia.com;

    include snippets/pixellap-acme.conf;

    location / {
        return 301 https://ppixelmedia.com$request_uri;
    }
}

# https://www.ppixelmedia.com -> https://ppixelmedia.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ppixelmedia.com;

    ssl_certificate     /etc/letsencrypt/live/ppixelmedia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ppixelmedia.com/privkey.pem;
    include snippets/pixellap-ssl.conf;

    return 301 https://ppixelmedia.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ppixelmedia.com;

    ssl_certificate     /etc/letsencrypt/live/ppixelmedia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ppixelmedia.com/privkey.pem;
    include snippets/pixellap-ssl.conf;

    include snippets/pixellap-gzip.conf;
    # Present only when the brotli module is installed (provision.sh); a glob with no match is fine.
    include snippets/pixellap-brotli*.conf;

    access_log /var/log/nginx/ppixelmedia.com.access.log;
    error_log  /var/log/nginx/ppixelmedia.com.error.log warn;

    # The contact form is the only POST (a Server Action) — small bodies only.
    client_max_body_size 2m;

    # Security headers (CSP, HSTS, X-Frame-Options...) come from next.config.ts.

    # Never serve dotfiles.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Hashed build assets: served from disk, cached forever.
    location /_next/static/ {
        alias /var/www/pixellap-web/current/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://pixellap_web;
        include snippets/pixellap-proxy.conf;
    }
}
