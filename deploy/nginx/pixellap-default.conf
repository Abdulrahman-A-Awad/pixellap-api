# Catch-all default server -> /etc/nginx/sites-available/pixellap-default.conf (provision.sh).
# Requests by IP address or for any host name we do not serve get no answer at all:
# HTTP closes the connection (444), HTTPS refuses the TLS handshake (no certificate is revealed).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_reject_handshake on;

    access_log off;
    return 444;
}
