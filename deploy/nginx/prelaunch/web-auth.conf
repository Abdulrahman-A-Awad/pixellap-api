# PRE-LAUNCH ONLY -> /etc/nginx/pixellap-prelaunch/web-auth.conf (website server block only).
# The whole website asks for a login (user "preview"; password in /root/pixellap-secrets.txt).
# Go live: delete /etc/nginx/pixellap-prelaunch, then nginx -t && systemctl reload nginx.

# Link-preview bots skip the login so shared links show a title, description and image
# (WhatsApp, Facebook/Messenger, X, LinkedIn, Slack, Telegram, Discord). They only read the
# <head>; the site stays noindex (X-Robots-Tag + robots meta), so nothing gets indexed.
# This is the user-agent map for the website: nginx `map` is only allowed at http level, so the
# same allowlist is matched here (server level, `if` + `set` only — the safe use of `if`) to keep
# everything inside this deletable folder. Removed with the folder at go-live.
set $pixellap_preview_auth "Pixellap preview";
if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|Slackbot|TelegramBot|Discordbot)") {
    set $pixellap_preview_auth off;
}
auth_basic $pixellap_preview_auth;
auth_basic_user_file /etc/nginx/pixellap-prelaunch/htpasswd;

# On-demand revalidation stays reachable without the login (it has its own secret header).
# Laravel normally calls http://127.0.0.1:3000 directly; this covers calls through Nginx.
location = /api/revalidate {
    auth_basic off;
    proxy_pass http://pixellap_web;
    include snippets/pixellap-proxy.conf;
}
