# Pixellap API + admin panel (Laravel on PHP 8.3-FPM, pool "pixellap").
# Installed by provision.sh as /etc/nginx/sites-available/api.ppixelmedia.com.conf once the
# Let's Encrypt certificate exists.

# HTTP: Let's Encrypt challenges, everything else -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.ppixelmedia.com;

    include snippets/pixellap-acme.conf;

    location / {
        return 301 https://api.ppixelmedia.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ppixelmedia.com;

    ssl_certificate     /etc/letsencrypt/live/api.ppixelmedia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ppixelmedia.com/privkey.pem;
    include snippets/pixellap-ssl.conf;

    include snippets/pixellap-gzip.conf;
    include snippets/pixellap-brotli*.conf;

    root /var/www/pixellap-api/public;
    index index.php;
    charset utf-8;

    access_log /var/log/nginx/api.ppixelmedia.com.access.log;
    error_log  /var/log/nginx/api.ppixelmedia.com.error.log warn;

    # Admin uploads (images / videos). Matches php/pixellap.ini.
    client_max_body_size 64M;

    # Laravel adds X-Frame-Options, nosniff, Referrer-Policy and Permissions-Policy to web/admin responses.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Never serve dotfiles (.env, .git...).
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Media library files (public disk). Paths include the media id, so a replaced file gets a
    # new URL — long cache, but not "immutable" (names are not content hashes).
    # The sandbox CSP stops an uploaded SVG/HTML file from running script on this origin.
    location /storage/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src data:; style-src 'unsafe-inline'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # Filament / Livewire published assets (versioned with ?v= query strings).
    location ~* ^/(css|js|fonts)/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm-pixellap.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Laravel's $request->secure() (secure session cookie, HTTPS-only admin).
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
        internal;
    }

    # Any other .php file (including uploads) is never executed.
    location ~ \.php$ {
        return 404;
    }
}
