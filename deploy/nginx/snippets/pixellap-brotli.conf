# Brotli (only installed when libnginx-mod-http-brotli-filter is available — see provision.sh).
# Browsers that support it get brotli; others fall back to gzip.
brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types
    text/plain text/css text/xml text/javascript text/x-component
    application/javascript application/json application/xml application/rss+xml
    application/manifest+json application/ld+json
    image/svg+xml font/ttf font/otf;
