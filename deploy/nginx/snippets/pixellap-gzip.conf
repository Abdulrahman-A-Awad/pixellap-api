# gzip for text responses (Next.js compression is disabled: compress: false in next.config.ts).
# Server-level, so it does not clash with `gzip on;` in Ubuntu's nginx.conf.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml text/javascript text/x-component
    application/javascript application/json application/xml application/rss+xml
    application/manifest+json application/ld+json
    image/svg+xml font/ttf font/otf;
