# Reverse proxy to Next.js.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;

# The visitor IP. The contact form's Server Action reads the FIRST X-Forwarded-For entry and
# forwards it to the API (per-visitor rate limit). Nginx is the edge, so the header is
# OVERWRITTEN with $remote_addr — a client-supplied X-Forwarded-For can never spoof it.
# (If a CDN/Cloudflare is ever put in front, use the real_ip module first.)
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# Streamed (partially prerendered) pages are sent as they render.
proxy_buffering off;
proxy_buffer_size 16k;
# Must satisfy: busy buffers (2 x 16k) < all buffers minus one (nginx -t refuses the 8 x 4k default).
proxy_buffers 8 16k;
proxy_read_timeout 60s;
proxy_connect_timeout 5s;
