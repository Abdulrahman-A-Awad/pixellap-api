; Pixellap PHP-FPM overrides -> /etc/php/8.3/fpm/conf.d/99-pixellap.ini (provision.sh)

; Admin uploads (images / hero videos). Keep in sync with client_max_body_size 64M in Nginx.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 120
expose_php = Off

; OPcache. validate_timestamps=0: PHP never re-reads changed files on its own —
; deploy-api.sh reloads php8.3-fpm after every deploy (and so must you after a manual edit).
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600
