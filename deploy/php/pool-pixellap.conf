; PHP-FPM pool for the API -> /etc/php/8.3/fpm/pool.d/pixellap.conf (provision.sh)
; Runs as the deploy user, which owns the code, storage/ and the queue worker:
; no permission juggling between www-data and deploy.
[pixellap]
user = deploy
group = deploy

listen = /run/php/php8.3-fpm-pixellap.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 4 GB box shared with MySQL and Next.js: ~8 workers x ~60 MB typical.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

request_terminate_timeout = 130s
catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/pixellap/php-fpm.log
